name: Handwriting scroll regression tests
on: [push]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform shells
        run: flutter create --platforms=android,windows --project-name kotoba --org fr.kotoba .
      - run: python tool/configure.py
      - run: python -m pip install fonttools==4.61.1
      - run: python tool/font.py
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --timeout 60s
